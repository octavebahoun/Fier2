<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1220" />
  <title>FIERI Research — Plateforme de recherche scientifique & innovation technologique</title>
  <meta name="description"
    content="FIERI Research rassemble chercheurs, étudiants et ingénieurs pour transformer des concepts scientifiques ambitieux en innovations industrielles concrètes. Projets, clubs de recherche, opportunités R&D et communauté.">

  <!-- Méta-données Open Graph pour les réseaux sociaux -->
  <meta property="og:title" content="FIERI Research — Recherche scientifique & innovation technologique">
  <meta property="og:description"
    content="Rejoignez la communauté FIERI : projets de recherche appliquée, clubs scientifiques, opportunités R&D et formations pour chercheurs et étudiants.">
  <meta property="og:image" content="/og-image.png"> <!-- À créer si nécessaire, sinon utilise favicon ou logo -->

  <meta property="og:type" content="website">

  <!-- Méta-données Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FIERI Research — Recherche scientifique & innovation technologique">
  <meta name="twitter:description"
    content="Rejoignez la communauté FIERI : projets de recherche appliquée, clubs scientifiques, opportunités R&D et formations pour chercheurs et étudiants.">
  <meta name="twitter:image" content="/og-image.png">

  <!-- Thème appliqué avant le premier pixel. Sans ce script, la page s'affiche
       dans le thème par défaut du CSS puis bascule quand React monte : c'est
       le flash blanc au chargement. Il rejoue volontairement, à l'identique,
       la logique de src/context/theme.js — un module ES ne peut pas s'exécuter
       de façon bloquante ici. -->
  <script>
    (function () {
      var theme = 'dark'
      try {
        var stored = localStorage.getItem('fieri-theme')
        if (stored === 'dark' || stored === 'light') theme = stored
        else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
      } catch (e) {
        if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
      }
      var dark = theme === 'dark'
      var root = document.documentElement
      root.classList.toggle('dark', dark)
      root.classList.toggle('light-theme', !dark)
      root.style.colorScheme = dark ? 'dark' : 'light'
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
